name: Build DAVESBX

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build FastAPI backend with PyInstaller
        shell: pwsh
        run: |
          pyinstaller davesbx-backend.spec --noconfirm
          # Copy the built exe to the Tauri resources directory
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item dist/davesbx-backend.exe src-tauri/binaries/davesbx-backend-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri build
          # This will automatically create a GitHub Release with the installer

      - name: Upload installer to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DAVESBX v1.0.${{ github.run_number }}
          body: |
            # DAVESBX — Sandbox Console

            Download and run the installer below. On first launch:
            - DAVESBX auto-generates a public URL and API key
            - The FastAPI backend starts automatically
            - No setup wizard — just open and use

            ## Files
            - **davesbx_*.exe** — NSIS installer (recommended)
            - **davesbx_*.msi** — MSI installer

            Built from commit ${{ github.sha }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
